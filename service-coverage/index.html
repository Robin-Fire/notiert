<script>
'use strict';
const documentTemplate=document.documentElement.cloneNode(true);
function migrateHierarchy(register){register.columns=register.columns.filter(c=>!['owner','coverage2','coverage5'].includes(c.id));for(const c of register.columns)if(c.id==='gap')c.name='Comment';for(const r of register.rows)for(const id of ['owner','coverage2','coverage5'])delete r.values[id];for(const [id,name] of [['area','Area'],['extension','Extension']]){if(!register.columns.some(c=>c.id===id))register.columns.splice(id==='area'?1:2,0,{id,name,type:'text',hidden:false});for(const r of register.rows)if(typeof r.values[id]!=='string')r.values[id]='';}return register;}
const $=s=>document.querySelector(s), coverage=['Unknown','Missing','Partial','Target met','N/A'];
let data=JSON.parse($('#seed').textContent);
migrateHierarchy(data);
let baseline=JSON.stringify(data),history=[],view='all',sort={id:'service',dir:1},page=0,extra=null,dirty=false;
const key='service-register:'+data.datasetId+':'+location.pathname;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500);}
function status(msg){$('#save-status').textContent=msg||((data.example?'Example data · ':'')+(dirty?'Unsaved changes':''));}
function checkpoint(){history.push(JSON.stringify(data));if(history.length>30)history.shift();}
function save(){dirty=true;try{localStorage.setItem(key,JSON.stringify({baseline,data}));status();}catch{status('Browser storage unavailable. Export your changes before closing.');}$('#undo').disabled=!history.length;}
function mutate(fn){checkpoint();fn();save();render();}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function tone(v){return v==='Target met'?'good':v==='Partial'||v==='High'?'partial':v==='Missing'||v==='Critical'?'missing':v==='Unknown'||v==='Not assessed'?'unknown':'neutral';}
function isGap(r){return data.columns.some(c=>c.id.startsWith('coverage')&&['Missing','Partial','Unknown'].includes(r.values[c.id]||'Unknown'));}
function rows(){const words=$('#search').value.toLowerCase().trim().split(/\s+/).filter(Boolean),risk=$('#risk').value,area=$('#area').value,extension=$('#extension').value;return data.rows.filter(r=>words.every(word=>Object.values(r.values).some(v=>String(v).toLowerCase().includes(word)))&&(!area||r.values.area===area)&&(!extension||JSON.stringify([r.values.area,r.values.extension])===extension)&&(!risk||r.values.criticality===risk)&&(view!=='attention'||r.values.criticality==='Critical'&&isGap(r))&&(view!=='unknown'||r.values.assessment!=='Assessed')&&(!extra||String(r.values[extra.id]||'').toLowerCase().includes(extra.value.toLowerCase()))).sort((a,b)=>{const group=(a.values.area||'').localeCompare(b.values.area||'')||(a.values.extension||'').localeCompare(b.values.extension||'');if(group)return group;const c=data.columns.find(c=>c.id===sort.id),av=a.values[sort.id]||'',bv=b.values[sort.id]||'';let n=c?.type==='number'?Number(av)-Number(bv):c?.type==='select'?c.options.indexOf(av)-c.options.indexOf(bv):av.localeCompare(bv,undefined,{numeric:true});return n*sort.dir;});}
function hierarchyFilters(){const a=$('#area'),e=$('#extension'),oldArea=a.value,oldExtension=e.value;const areas=[...new Set(data.rows.map(r=>r.values.area).filter(Boolean))].sort();a.replaceChildren(new Option('All areas',''),...areas.map(x=>new Option(x,x)));a.value=areas.includes(oldArea)?oldArea:'';const pairs=[...new Map(data.rows.filter(r=>(!a.value||r.values.area===a.value)&&r.values.extension).map(r=>[JSON.stringify([r.values.area,r.values.extension]),r.values])).entries()].sort((a,b)=>a[1].area.localeCompare(b[1].area)||a[1].extension.localeCompare(b[1].extension));e.replaceChildren(new Option('All extensions',''),...pairs.map(([key,v])=>new Option(a.value?v.extension:`${v.area||'Unassigned area'} / ${v.extension}`,key)));e.value=pairs.some(([key])=>key===oldExtension)?oldExtension:'';}
function render(){
hierarchyFilters();
$('#stats').replaceChildren(...[['Services',data.rows.length],['Critical gaps',data.rows.filter(r=>r.values.criticality==='Critical'&&isGap(r)).length],['Needs assessment',data.rows.filter(r=>r.values.assessment!=='Assessed').length],['Assessed',data.rows.filter(r=>r.values.assessment==='Assessed').length]].map(([name,n])=>{const d=el('div',undefined,'stat');d.append(el('span',name),el('strong',String(n).padStart(2,'0')));return d;}));
const cols=data.columns.filter(c=>!c.hidden),hr=el('tr');for(const c of cols){const th=el('th');th.setAttribute('aria-sort',sort.id===c.id?(sort.dir===1?'ascending':'descending'):'none');const b=el('button',c.name+(sort.id===c.id?(sort.dir===1?' ↑':' ↓'):' ↕'));b.onclick=()=>{sort={id:c.id,dir:sort.id===c.id?-sort.dir:1};render();};th.append(b);hr.append(th);}hr.append(el('th','Actions'));$('#head').replaceChildren(hr);
const filtered=rows(),pages=Math.max(1,Math.ceil(filtered.length/25));page=Math.max(0,Math.min(page,pages-1));$('#body').replaceChildren();for(const r of filtered.slice(page*25,page*25+25)){const tr=el('tr');for(const c of cols){const td=el('td'),v=r.values[c.id]||'';if(c.type==='select'){const s=el('select',undefined,'badge '+tone(v));s.setAttribute('aria-label',`${r.values.service}: ${c.name}`);s.append(new Option('—',''),...c.options.map(x=>new Option(x,x)));s.value=v;s.onchange=()=>mutate(()=>r.values[c.id]=s.value);td.append(s);}else{const b=el('button',v||'—','cell');b.title=v||'Click to edit';b.setAttribute('aria-label',`${r.values.service}: ${c.name}: ${v||'empty'}`);b.onclick=()=>edit(td,r,c);td.append(b);}tr.append(td);}const td=el('td');td.style.minWidth='65px';const del=el('button','×');del.setAttribute('aria-label','Delete '+r.values.service);del.onclick=()=>confirmAction('Delete service?',`Remove ${r.values.service||'this service'} from the register?`,()=>mutate(()=>data.rows=data.rows.filter(x=>x.id!==r.id)));td.append(del);tr.append(td);$('#body').append(tr);}
groupRows(filtered,cols.length+1);$('#empty').hidden=!!filtered.length;$('#count').textContent=`${filtered.length? page*25+1:0}–${Math.min((page+1)*25,filtered.length)} of ${filtered.length} matching services · ${data.rows.length} total`;$('#page').textContent=`${page+1} / ${pages}`;$('#prev').disabled=page===0;$('#next').disabled=page===pages-1;$('#filter').textContent=extra?'Filter: '+(data.columns.find(c=>c.id===extra.id)?.name||'')+' contains '+extra.value:'＋ Filter';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('#undo').disabled=!history.length;}
function groupRows(filtered,colspan){const body=$('#body'),services=[...body.children];let lastArea=null,lastExtension=null;const shown=filtered.slice(page*25,page*25+25);shown.forEach((r,i)=>{const area=r.values.area||'Unassigned area',extension=r.values.extension||'Unassigned extension';if(area!==lastArea){const tr=el('tr',undefined,'area-group'),td=el('td');td.colSpan=colspan;td.textContent=area+' · '+filtered.filter(x=>(x.values.area||'Unassigned area')===area).length+' services';tr.append(td);body.insertBefore(tr,services[i]);lastArea=area;lastExtension=null;}if(extension!==lastExtension){const tr=el('tr',undefined,'extension-group'),td=el('td');td.colSpan=colspan;td.textContent='↳ '+extension+' · '+filtered.filter(x=>(x.values.area||'Unassigned area')===area&&(x.values.extension||'Unassigned extension')===extension).length+' services';tr.append(td);body.insertBefore(tr,services[i]);lastExtension=extension;}});}
function edit(td,r,c){const input=el('input',undefined,'editor');input.type=c.type==='date'?'date':c.type==='number'?'number':'text';input.value=r.values[c.id]||'';input.setAttribute('aria-label',c.name);td.replaceChildren(input);input.focus();if(input.type==='text')input.select();let done=false;const finish=cancel=>{if(done)return;done=true;const v=['area','extension'].includes(c.id)?input.value.trim():input.value;if(!cancel&&v!==r.values[c.id]){if(c.id==='service'&&!v.trim()){toast('Service name cannot be empty.');render();return;}mutate(()=>r.values[c.id]=v);}else render();};input.onblur=()=>finish(false);input.onkeydown=e=>{if(e.key==='Enter')finish(false);if(e.key==='Escape')finish(true);};}
function dialog(title,description){const d=$('#dialog');d.replaceChildren(el('h2',title));if(description)d.append(el('p',description));d.showModal();return d;}
function field(d,label,type='text',value=''){const id=crypto.randomUUID(),l=el('label',label);l.htmlFor=id;const input=el(type==='textarea'?'textarea':'input');input.id=id;if(type!=='textarea')input.type=type;input.value=value;d.append(l,input);return input;}
function buttons(d,label,fn){const a=el('div',undefined,'actions'),cancel=el('button','Cancel'),ok=el('button',label,'primary');cancel.onclick=()=>d.close();ok.onclick=fn;a.append(cancel,ok);d.append(a);}
function confirmAction(title,msg,fn){const d=dialog(title,msg);buttons(d,'Confirm',()=>{d.close();fn();});}
$('#add').onclick=()=>{const d=dialog('Add service',''),area=field(d,'Area','text',$('#area').value),extension=field(d,'Extension','text',$('#extension').value?JSON.parse($('#extension').value)[1]:''),name=field(d,'Service name');buttons(d,'Add service',()=>{for(const input of [area,extension,name])if(!input.value.trim()){input.focus();toast('Enter an area, extension, and service name.');return;}mutate(()=>{const r={id:crypto.randomUUID(),values:Object.fromEntries(data.columns.map(c=>[c.id,c.id.startsWith('coverage')?'Unknown':'']))};Object.assign(r.values,{area:area.value.trim(),extension:extension.value.trim(),service:name.value.trim(),criticality:'Normal',assessment:'Not assessed',priority:'Normal'});data.rows.push(r);});d.close();toast('Service added. Clear filters if it is not visible.');});name.focus();};
$('#columns').onclick=()=>{const d=dialog('Manage columns','Show, rename, reorder, or add fields. Hidden columns keep their data.');const list=el('div',undefined,'column-list');data.columns.forEach((c,i)=>{const r=el('div',undefined,'column-row'),check=el('input');check.type='checkbox';check.checked=!c.hidden;check.disabled=c.id==='service';check.setAttribute('aria-label','Show '+c.name);check.onchange=()=>mutate(()=>c.hidden=!check.checked);const name=el('span',c.name),rename=el('button','Rename');rename.onclick=()=>{d.close();const x=dialog('Rename column','The field ID and existing values stay the same.'),v=field(x,'Column name','text',c.name);buttons(x,'Save',()=>{if(v.value.trim()){mutate(()=>c.name=v.value.trim());x.close();}});};const up=el('button','↑');up.disabled=i<=1;up.setAttribute('aria-label','Move '+c.name+' left');up.onclick=()=>{mutate(()=>[data.columns[i-1],data.columns[i]]=[data.columns[i],data.columns[i-1]]);d.close();$('#columns').click();};r.append(check,name,rename,up);list.append(r);});d.append(list);const a=el('div',undefined,'actions'),close=el('button','Done'),add=el('button','＋ Add column','primary');close.onclick=()=>d.close();add.onclick=()=>{d.close();addColumn();};a.append(close,add);d.append(a);};
function addColumn(){const d=dialog('Add a column','Create a text, date, number, or dropdown field.'),name=field(d,'Column name'),l=el('label','Field type'),type=el('select');type.setAttribute('aria-label','Field type');['text','date','number','select'].forEach(t=>type.add(new Option(t,t)));d.append(l,type);const options=field(d,'Dropdown options (one per line)','textarea');buttons(d,'Add column',()=>{const opts=[...new Set(options.value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!name.value.trim()||type.value==='select'&&!opts.length){toast('Enter a name and options for dropdown fields.');return;}mutate(()=>data.columns.push({id:'custom_'+crypto.randomUUID(),name:name.value.trim(),type:type.value,...(type.value==='select'?{options:opts}:{}),hidden:false}));d.close();});}
$('#filter').onclick=()=>{const d=dialog('Filter a column','Match text in any field, including hidden columns.'),select=el('select');select.setAttribute('aria-label','Filter column');data.columns.forEach(c=>select.add(new Option(c.name,c.id)));d.append(select);const value=field(d,'Contains');if(extra){select.value=extra.id;value.value=extra.value;}buttons(d,'Apply filter',()=>{extra=value.value?{id:select.value,value:value.value}:null;page=0;render();d.close();});};
$('#clear').onclick=()=>{$('#search').value='';$('#area').value='';$('#extension').value='';$('#risk').value='';extra=null;view='all';page=0;render();};$('#search').oninput=()=>{page=0;render();};$('#area').onchange=()=>{$('#extension').value='';page=0;render();};$('#extension').onchange=$('#risk').onchange=()=>{page=0;render();};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;page=0;render();});$('#prev').onclick=()=>{page--;render();};$('#next').onclick=()=>{page++;render();};$('#undo').onclick=()=>{if(history.length){data=JSON.parse(history.pop());save();render();}};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Download created. Save it to your chosen location.');}
$('#export').onclick=()=>download('coverage-register.json',JSON.stringify(data,null,2)+'\n','application/json');
function standaloneHTML(){const doc=documentTemplate.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(data,null,2).replace(/</g,'\\u003c');return '<!doctype html>\n'+doc.outerHTML;}
$('#html').onclick=()=>{const currentName=decodeURIComponent(location.pathname.split('/').pop()||'');const filename=currentName.toLowerCase().endsWith('.html')?currentName:'service-coverage.html';download(filename,standaloneHTML(),'text/html');status('HTML downloaded. Replace your shared copy.');};
function validate(x){if(!x||x.version!==1||typeof x.datasetId!=='string'||!Array.isArray(x.columns)||!Array.isArray(x.rows)||x.columns.length>100||x.rows.length>10000)throw Error('Expected a version 1 register with columns and rows.');const ids=new Set();for(const c of x.columns){if(!c||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.name!=='string'||!['text','date','number','select'].includes(c.type)||c.type==='select'&&(!Array.isArray(c.options)||c.options.some(o=>typeof o!=='string')))throw Error('Invalid or duplicate column.');ids.add(c.id);}for(const id of ['service','criticality','assessment'])if(!ids.has(id))throw Error('Missing required column: '+id);const rids=new Set();for(const r of x.rows){if(!r||typeof r.id!=='string'||rids.has(r.id)||!r.values||typeof r.values.service!=='string'||!r.values.service.trim()||Object.values(r.values).some(v=>typeof v!=='string'))throw Error('Invalid row; values must be strings and service names cannot be empty.');rids.add(r.id);for(const c of x.columns){const v=r.values[c.id];if(c.type==='select'&&v&&!c.options.includes(v))throw Error('Unknown dropdown value in '+c.name);}}return x;}
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('File exceeds 10 MB.');const next=migrateHierarchy(validate(JSON.parse(await file.text())));confirmAction('Import register?',`Replace the current ${data.rows.length} services with ${next.rows.length} imported services? You can undo this action.`,()=>mutate(()=>{data=next;extra=null;page=0;$('#area').value='';$('#extension').value='';$('#search').value='';$('#risk').value='';view='all';}));}catch(err){toast('Import failed: '+err.message);}e.target.value='';};
status();render();try{const draft=JSON.parse(localStorage.getItem(key)||'null');if(draft&&JSON.stringify(draft.data)!==baseline){migrateHierarchy(validate(draft.data));const d=dialog('A browser draft is available',draft.baseline===baseline?'Restore your previous edits, or use the data embedded in this HTML file.':'This HTML and the browser draft differ. Choose which version to load; the draft is never applied automatically.');buttons(d,'Restore draft',()=>{mutate(()=>data=draft.data);d.close();});d.querySelector('.actions button').textContent='Use file data';}}catch{status('Browser draft unavailable. Export files to preserve your edits.');}
</script></body></html>
